name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacote:
    name: Pacote UPM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Conferir o package.json
        run: |
          jq -e '.name and .version and .unity and .displayName' package.json > /dev/null

      - name: Conferir os .meta
        run: |
          falhou=0
          caminhos=$(git ls-files | grep -v '^\.' | grep -v '\.meta$' | while read -r arquivo; do
            echo "$arquivo"
            dirname "$arquivo"
          done | grep -v '^\.$' | sort -u)

          while read -r caminho; do
            if ! git ls-files --error-unmatch "$caminho.meta" > /dev/null 2>&1; then
              echo "::error::Falta o .meta de $caminho"
              falhou=1
            fi
          done <<< "$caminhos"

          for meta in $(git ls-files | grep '\.meta$'); do
            if [ ! -e "${meta%.meta}" ]; then
              echo "::error::O $meta não tem arquivo ou pasta correspondente"
              falhou=1
            fi
          done

          exit $falhou

      - name: Conferir o encoding
        run: |
          if git grep -lI $'\xef\xbf\xbd' -- '*.cs' '*.md'; then
            echo "::error::Há caracteres quebrados nos arquivos acima"
            exit 1
          fi
